let mode=(/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))?'iphone':'android',step=0;const $=id=>document.getElementById(id);function render(){let ios=mode==='iphone';$('title').textContent='INSTALACIÓN PARA '+(ios?'IPHONE':'ANDROID');$('intro').textContent='Si no puedes instalar, abre el enlace en '+(ios?'Safari.':'Chrome.');document.querySelectorAll('[data-step]').forEach((b,i)=>{if(i===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});document.querySelectorAll('.line').forEach((l,i)=>l.classList.toggle('done',i<step));$('instruction').innerHTML=data[mode][step][0];$('visual').innerHTML=data[mode][step][1];$('copy').textContent=ios?'⧉  Copiar enlace':'↓  Instalar app';$('tutorial').hidden=!ios;$('status').textContent=''}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);render()});$('copy').onclick=async()=>{if(mode==='android'){step=0;render();$('status').textContent='Sigue los tres pasos de esta vista previa.';return}const v='https://example.com';try{await navigator.clipboard.writeText(v);$('status').textContent='Enlace copiado.'}catch{const e=document.createElement('textarea');e.value=v;document.body.append(e);e.select();let ok=false;try{ok=document.execCommand('copy')}catch{}e.remove();$('status').textContent=ok?'Enlace copiado.':v}};$('tutorial').onclick=()=>{$('tutorialDialog').showModal();$('tutorialVideo').currentTime=0;$('tutorialVideo').play().catch(()=>{})};$('closeTutorial').onclick=()=>$('tutorialDialog').close();$('tutorialDialog').addEventListener('close',()=>$('tutorialVideo').pause());$('tutorialDialog').addEventListener('click',e=>{if(e.target===$('tutorialDialog'))$('tutorialDialog').close()});render();
